[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: marks tests as benchmark tests requiring external resources
    llm_required: marks tests that require LLM API access
    
# Note: timeout requires pytest-timeout plugin
# Install with: pip install pytest-timeout
# timeout = 300

# Default options
addopts = 
    -v
    --tb=short
    --strict-markers

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Ignore certain directories
# llm_required/, misc/ and creator/ hold manual diagnostic scripts that call real LLM APIs
# and/or Docker; run them directly with python (see tests/README.md)
norecursedirs = .git .tox dist build *.egg test_outputs llm_required misc creator integration